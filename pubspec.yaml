name: saving_app
description: "A secure savings and foundation accounting app for members and administrators."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # Network
  dio: ^5.4.0

  # Local Storage
  get_storage: ^2.1.1

  # UI
  intl: ^0.19.0

  # Image & File Picker
  image_picker: ^1.1.2
  file_picker: ^8.1.3

  # Notifications
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^17.2.2

  # ─── Supabase ────────────────────────────────────────
  supabase_flutter: ^2.12.2

  # Utils
  url_launcher: ^6.3.0

  csv: ^6.0.0
  path_provider: ^2.1.2
  share_plus: ^10.1.0
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Assets commented out because the folders do not exist on disk
  assets:
    - assets/fonts/
  fonts:
     - family: Nunito
       fonts:
         - asset: assets/fonts/Nunito-Regular.ttf
         - asset: assets/fonts/Nunito-Medium.ttf
           weight: 500
         - asset: assets/fonts/Nunito-SemiBold.ttf
           weight: 600
         - asset: assets/fonts/Nunito-Bold.ttf
           weight: 700
         - asset: assets/fonts/Nunito-ExtraBold.ttf
           weight: 800
     - family: NotoSansBengali
       fonts:
         - asset: assets/fonts/NotoSansBengali.ttf
